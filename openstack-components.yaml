---
# This file is used to determine which services will be installed automatically
# via the hyperconverged lab and in a future release the genestack-installed.
components:
  barbican: true
  blazar: false
  ceilometer: false
  cinder: false
  # cinder-volume is a pseudo service handled by the hyperconverged lab: it
  # runs the cinder volumes data-plane enablement (volume/VG prep, the cinder
  # volumes playbook on labeled storage nodes, volume type/QoS). 'cinder'
  # above covers only the control-plane chart.
  cinder-volume: false
  cloudkitty: false
  freezer: false
  glance: true
  gnocchi: false
  heat: false
  keystone: true
  magnum: false
  manila: false
  masakari: false
  neutron: true
  nova: true
  octavia: false
  placement: true
  skyline: true
  swift: false
  trove: false
  zaqar: false
