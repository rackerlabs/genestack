---
prelude: |
  Limited Availability (LA) release of our managed Database-as-a-Service (DBaaS),
  powered by OpenStack Trove.

  **Scope & Constraints:**
  Because this service is in LA, the following constraints apply:
    - No SLA Guarantees: This service does not currently carry a Service Level Agreement (SLA).
    - Capacity Quotas: Each enrolled account is limited to a maximum of 40 GB of total storage
                       for all database instance volumes.

  **How to Provide Feedback:**
  Your feedback is critical to helping us refine this service.
  Please submit any bugs, performance issues, or feature requests via the Rackspace ticketing
  system(s) or create a github issue.
features:
  - |
