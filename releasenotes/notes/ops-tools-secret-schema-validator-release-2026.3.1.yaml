---
features:
  - |
    Adds ``ops-tools/secret_schema_validator`` to compare the service secret
    descriptors in ``bin/services/*.yaml`` with sensitive Helm chart values from
    the chart versions pinned in ``helm-chart-versions.yaml``.
  - |
    The validator can be run after updating chart versions to identify missing
    service secret schema entries before the corresponding ``bin/install-*.sh``
    script is used in a deployment.
