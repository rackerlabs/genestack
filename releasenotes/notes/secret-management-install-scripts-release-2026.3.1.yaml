---
features:
  - |
    Service install scripts now manage Kubernetes secrets from the per-service
    descriptors in ``bin/services/*.yaml``. The shared installer helper creates
    missing service-owned secrets, validates required secret keys, and reuses
    existing secret values instead of requiring a separate cluster-wide secret
    bootstrap step on brownfield deployments.
  - |
    Added shared secret helper primitives for idempotent secret checks, secret
    key validation, file-backed secret sync, and temporary file cleanup. Secret
    material rendered through temporary files is tracked by the installer and
    removed on both successful and failed exits.
  - |
    ``bin/install-barbican.sh`` now preserves brownfield
    ``barbican-simple-crypto-kek`` handling by adopting an existing deployed
    KEK from ``barbican-etc`` before any new KEK generation is considered. The
    installer also emits a prominent non-blocking warning when the well-known
    default Barbican KEK is detected.
  - |
    Manila and Trove techpreview enablement now use the shared install-script
    secret helpers for chart-derived service passwords. Their enablement roles
    no longer generate or rotate database, RabbitMQ, or service-user passwords
    outside the per-service secret schema.
upgrade:
  - |
    Operators adding or reinstalling individual services no longer need a
    separate cluster-wide secret bootstrap command. Re-running an individual
    ``bin/install-*.sh`` script creates only missing keys and leaves existing
    secrets unchanged.
security:
  - |
    Install scripts now warn when chart default or known default passwords are
    detected in existing Kubernetes secrets. These warnings are non-blocking so
    older clusters can continue to deploy, but they are intended to be visible
    enough for operators to plan secret rotation.
