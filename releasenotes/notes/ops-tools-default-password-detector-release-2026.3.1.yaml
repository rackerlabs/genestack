---
features:
  - |
    Adds ``ops-tools/default_password_detector`` to scan Kubernetes Secrets
    referenced by ``bin/services/*.yaml`` and report values that still match the
    default credential values from the Helm chart version pinned in
    ``helm-chart-versions.yaml``.
  - |
    The detector is read-only, does not print secret values, and exits with a
    distinct status when chart-default credentials are found so install scripts
    can emit loud non-blocking warnings for brownfield clusters.
