---
features:
  - |
    Documented the Genestack Console under Getting Started. The console
    is installed at ``/opt/genestack-console`` on the deploy host and runs
    the Genestack tree in ``/opt/genestack``. Bare-metal machines stay on
    local disk unless they are commissioned and then booted into Talos.
    ``https://my.genestack.dev`` is the account portal for that console,
    not a hosted copy of it. The console source is pinned at
    ``submodules/genestack-console`` from PIndustries/genestack-console
    tag v2026.10.02. The operator manual is in that repository.
