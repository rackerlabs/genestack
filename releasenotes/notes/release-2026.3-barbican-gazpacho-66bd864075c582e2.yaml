---
prelude: >
  Barbican's simple_crypto master key-encryption-key (KEK) can now be
  managed through Kubernetes instead of Helm override files. The KEK is
  read at deploy time from the `barbican-simple-crypto-plugin-kek`
  Kubernetes Secret and injected by `install-barbican.sh`; rotation is
  planned and staged with `scripts/barbican-kek-rewrite-planner.py` and
  executed by the OpenStack-Helm db-sync KEK rewrap.
  This applies to the OpenStack-Helm 2026.1.x barbican charts (the
  OpenStack Gazpacho stream; see `helm-chart-versions.yaml`). Note that
  Genestack release numbers are independent of OpenStack coordinated
  release numbers: this Genestack 2026.3 release deploys OpenStack
  Gazpacho (2026.1).
  This release also stages (inert) PKCS#11 HSM support for Barbican's
  crypto backend.
features:
  - |
    `create-secrets.sh` now generates a valid 44-character Fernet-format
    KEK (`generate_fernet_token`) and stores it in the
    `barbican-simple-crypto-plugin-kek` Kubernetes Secret, alongside an
    initially empty `old_keks` rotation-history data key. New greenfield
    regions therefore start on a unique, region-specific KEK instead of
    the publicly documented upstream default.
  - |
    `install-barbican.sh` injects the KEK from the
    `barbican-simple-crypto-plugin-kek` Secret via `--set` (validated as
    a 44-character Fernet key; malformed values abort the deploy) and the
    `old_keks` history via `--set-string` into
    `conf.simple_crypto_kek_rewrap.old_kek`. When the Secret is absent or
    empty, deploys behave exactly as before and any KEK in override files
    continues to apply.
  - |
    Added `scripts/barbican-kek-rewrite-planner.py`: plans (dry-run,
    read-only), stages (`--apply`), or adopts (`--adopt`) KEK rotations,
    and verifies KEKs against the database (`--validate
    deployed|staged|<kek>`). Every staged rotation is first proven to
    cover the keys actually wrapping the `kek_data` rows, and a
    staged-but-undeployed rotation is protected from being overwritten.
  - |
    Staged PKCS#11 HSM support: an inert `p11_crypto_plugin`
    configuration block is included in the barbican helm overrides. It is
    not listed in `enabled_crypto_plugins`, so `simple_crypto` remains
    the active backend and deployment behavior is unchanged. Activation
    is per-cluster via flex overrides supplying `library_path`,
    `token_labels`/`slot_id`, and enabling the plugin.
  - |
    The PKCS#11 token User PIN is stored in the
    `barbican-hsm-credentials` Kubernetes Secret (generated by
    `create-secrets.sh`; for production and staging, export
    `BARBICAN_HSM_PIN` with the HSM-administrator-provided PIN before
    running it) and injected at deploy time by `install-barbican.sh` into
    `conf.barbican.p11_crypto_plugin.login`. An absent or empty Secret is
    a no-op.
upgrade:
  - |
    **Gazpacho Barbican requires an explicit KEK.** The simple_crypto
    plugin no longer falls back to the built-in well-known default: if no
    kek is rendered into `barbican.conf`, barbican fails to start with
    `SimpleCrypto KEK is undefined`. Environments that already set a KEK
    in their Helm overrides need no changes. Environments that never set
    one — previously running implicitly on the well-known default — MUST
    act before or with the Gazpacho upgrade: run
    `scripts/barbican-kek-rewrite-planner.py --adopt` to stage the
    currently active KEK into the `barbican-simple-crypto-plugin-kek`
    Secret (no rotation occurs), or perform a full rotation as described
    below. Do not create the Secret by hand and do not expect
    `create-secrets.sh` to configure Barbican on an existing environment:
    a Secret whose value is not coordinated with the deployed KEK
    overrides your configuration on the next deploy and can trigger a
    failed rewrap.
  - |
    To rotate an existing environment off the upstream well-known default
    KEK: run `scripts/barbican-kek-rewrite-planner.py` (dry run), review,
    re-run with `--apply`, **back up the Barbican database**, then run
    `install-barbican.sh` — the db-sync job performs a one-way rewrap of
    all project KEKs. Afterward `barbican-kek-rewrite-planner.py
    --validate deployed` must pass and the db-sync logs must show zero
    rewrap failures. Note that Octavia certificates and Cinder volume
    encryption keys depend on Barbican secrets remaining decryptable.
  - |
    Environments that rotated their KEK on earlier releases can adopt
    Secret-based management without another rotation:
    `scripts/barbican-kek-rewrite-planner.py --adopt` stages the currently
    deployed KEK into the Secret, then run `install-barbican.sh` once,
    confirm `--validate deployed` passes, and remove the KEK from your
    override files (the Secret's `--set` takes precedence over them).
  - |
    Enabling `p11_crypto` later does not re-encrypt existing secrets:
    rows stored under `simple_crypto` remain wrapped by the simple_crypto
    KEK indefinitely (dual-plugin operation decrypts them via their
    original backend). The KEK requirements and rotation workflow above
    therefore remain in force after HSM activation. Complete any planned
    KEK rotation before enabling the HSM backend, so the rewrap runs
    while the database is still single-plugin.
security:
  - |
    Deployments that never set a KEK have been running simple_crypto on
    Barbican's publicly documented default key, meaning stored secrets
    (including Octavia certificates and Cinder encryption keys) were
    protected by a key that is public knowledge. The rotation workflow
    above retires that default. No KEK value is stored in Genestack
    repositories; keys exist only in Kubernetes and in the rendered
    Barbican configuration.
issues:
  - |
    The OpenStack-Helm 2026.1.x barbican chart's `values.yaml` still
    contains a comment stating that barbican falls back to a well-known
    default when no kek is provided. That comment is stale: the Gazpacho
    barbican service removed the default (`kek` defaults to an empty
    list and plugin initialization raises `SimpleCrypto KEK is
    undefined`). Trust the service behavior, not the chart comment.
