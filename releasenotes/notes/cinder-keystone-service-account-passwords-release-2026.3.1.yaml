---
security:
  - |
    The OpenStack-Helm cinder chart's ks-user job creates three Keystone
    service accounts besides ``cinder``: ``cinder_nova`` (the ``[nova]``
    section), ``cinder_service_user`` (the ``[service_user]`` section) and
    ``cinder_swift`` (``backup_swift_key``), each with the ``admin`` and
    ``service`` roles. Genestack set a password only for ``cinder``, so the
    other three were created with the chart's ``values.yaml`` default, the
    literal string ``password``, and that value was rendered into the cinder
    configuration. ``create-secrets.sh`` now generates
    ``cinder-keystone-nova-password``, ``cinder-keystone-service-password``
    and ``cinder-keystone-swift-password``, and ``install-cinder.sh`` passes
    them to the chart as ``endpoints.identity.auth.nova.password``,
    ``endpoints.identity.auth.service.password`` and
    ``endpoints.identity.auth.swift.password``.
upgrade:
  - |
    Existing clusters never re-run ``create-secrets.sh``, so
    ``install-cinder.sh`` creates each of the three Secrets once when it is
    missing and leaves it unchanged on later deploys. On the first deploy
    after this change the ks-user job replaces the default passwords of
    ``cinder_nova``, ``cinder_service_user`` and ``cinder_swift`` with the
    generated ones, and the same release renders them into the cinder
    configuration. Cinder pods still running the previous configuration
    cannot authenticate as these accounts until the rollout completes. A
    host-based ``cinder-volume`` keeps the old values until
    ``deploy-cinder-volume.yaml`` is re-run, so run it right after the
    deploy.
