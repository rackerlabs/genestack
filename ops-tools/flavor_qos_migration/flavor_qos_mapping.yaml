  lite:
    max_kbytes_per_second: 150000
    burst_kbytes: 250000
  plus:
    max_kbytes_per_second: 250000
    burst_kbytes: 500000
  pro:
    max_kbytes_per_second: 375000
    burst_kbytes: 750000
