---
images:
  tags:
    bootstrap: "ghcr.io/rackerlabs/genestack-images/heat:2026.1-latest"
    db_init: "ghcr.io/rackerlabs/genestack-images/heat:2026.1-latest"
    db_drop: "ghcr.io/rackerlabs/genestack-images/heat:2026.1-latest"
    ks_user: "ghcr.io/rackerlabs/genestack-images/heat:2026.1-latest"
    ks_service: "ghcr.io/rackerlabs/genestack-images/heat:2026.1-latest"
    ks_endpoints: "ghcr.io/rackerlabs/genestack-images/heat:2026.1-latest"
    dep_check: "ghcr.io/rackerlabs/genestack-images/kubernetes-entrypoint:latest"
    designate_db_sync: "ghcr.io/rackerlabs/genestack-images/designate:2026.1-latest"
    designate_api: "ghcr.io/rackerlabs/genestack-images/designate:2026.1-latest"
    designate_central: "ghcr.io/rackerlabs/genestack-images/designate:2026.1-latest"
    designate_mdns: "ghcr.io/rackerlabs/genestack-images/designate:2026.1-latest"
    designate_worker: "ghcr.io/rackerlabs/genestack-images/designate:2026.1-latest"
    designate_producer: "ghcr.io/rackerlabs/genestack-images/designate:2026.1-latest"
    designate_sink: "ghcr.io/rackerlabs/genestack-images/designate:2026.1-latest"
    designate_service_cleaner: "kernelpanic53/rackerlabs-designate:2026-master" ## TEMP FIX USING MASTER BRANCH AS OF 02-2026
    image_repo_sync: null
    rabbit_init: null
    test: null
  pull_policy: "IfNotPresent"

pod:
  replicas:
    api: 1
    central: 1
    mdns: 1
    producer: 1
    sink: 1
    worker: 1
  resources:
    enabled: false
    api:
      requests:
        memory: "384Mi"
        cpu: "100m"
      limits: {}
  mounts:
    designate_api:
      init_container: null
      designate_api:
        volumeMounts:
          - name: rndc-key
            mountPath: /etc/designate/rndc.key
            subPath: rndc.key
        volumes:
          - name: rndc-key
            secret:
              secretName: rndc-key-secret
    designate_central:
      init_container: null
      designate_central:
        volumeMounts:
          - name: rndc-key
            mountPath: /etc/designate/rndc.key
            subPath: rndc.key
        volumes:
          - name: rndc-key
            secret:
              secretName: rndc-key-secret
    designate_mdns:
      init_container: null
      designate_mdns:
        volumeMounts:
          - name: rndc-key
            mountPath: /etc/designate/rndc.key
            subPath: rndc.key
        volumes:
          - name: rndc-key
            secret:
              secretName: rndc-key-secret
    designate_worker:
      init_container: null
      designate_worker:
        volumeMounts:
          - name: rndc-key
            mountPath: /etc/designate/rndc.key
            subPath: rndc.key
        volumes:
          - name: rndc-key
            secret:
              secretName: rndc-key-secret
    designate_producer:
      init_container: null
      designate_producer:
        volumeMounts:
          - name: rndc-key
            mountPath: /etc/designate/rndc.key
            subPath: rndc.key
        volumes:
          - name: rndc-key
            secret:
              secretName: rndc-key-secret
    designate_sink:
      init_container: null
      designate_sink:
        volumeMounts:
          - name: rndc-key
            mountPath: /etc/designate/rndc.key
            subPath: rndc.key
        volumes:
          - name: rndc-key
            secret:
              secretName: rndc-key-secret

network:
  mdns:
    name: "designate-mdns"
    proto: "http"
    external_policy_local: false
    node_port:
      enabled: true
      port: 5354

conf:
  pools: |
    - name: default
      # The name is immutable. There will be no option to change the name after
      # creation and the only way will to change it will be to delete it
      # (and all zones associated with it) and recreate it.
      description: Default Pool

      attributes: {}

      # List out the NS records for zones hosted within this pool
      # This should be a record that is created outside of designate, that
      # points to the public IP of the controller node.
      ns_records:
        - hostname: {{ printf "ns.%s.svc.%s." .Release.Namespace .Values.endpoints.cluster_domain_suffix }}
          priority: 1

      # List out the nameservers for this pool. These are the actual DNS servers.
      # We use these to verify changes have propagated to all nameservers.
      nameservers:
        - host: 127.0.0.1 # enter your own values ${POWERDNS_SERVICE_HOST}
          port: {{ tuple "powerdns" "internal" "powerdns" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}

      # List out the targets for this pool. For BIND there will be one
      # entry for each BIND server, as we have to run rndc command on each server
      targets:
        - type: pdns4
          description: PowerDNS Server

          # List out the designate-mdns servers from which PowerDNS servers should
          # request zone transfers (AXFRs) from.
          # This should be the IP of the controller node.
          # If you have multiple controllers you can add multiple masters
          # by running designate-mdns on them, and adding them here.
          masters:
            - host: 127.0.0.1 # enter your own values ${MINIDNS_SERVICE_HOST}
              port: {{ tuple "mdns" "internal" "ipc" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}

          # PowerDNS Configuration options
          options:
            host: 127.0.0.1 # enter your own values ${POWERDNS_SERVICE_HOST}
            port: {{ tuple "powerdns" "internal" "powerdns" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
            api_endpoint: http://${POWERDNS_SERVICE_HOST}:{{ tuple "powerdns" "internal" "powerdns_api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
            api_token: {{ tuple "powerdns" "service" . | include "helm-toolkit.endpoints.endpoint_token_lookup" }}

  policy: {}
  designate:
    DEFAULT:
      debug: false
      log_config_append: /etc/designate/logging.conf
    database:
      connection_debug: 0
      connection_recycle_time: 600
      connection_trace: true
      idle_timeout: 3600
      mysql_sql_mode: {}
      use_db_reconnect: true
      pool_timeout: 60
      max_retries: -1
    keystone_authtoken:
      service_token_roles: service
      service_token_roles_required: true
      auth_type: password
      auth_version: v3
      memcache_security_strategy: ENCRYPT
      service_type: dns
    oslo_concurrency:
      lock_path: /tmp/designate
    oslo_messaging_notifications:
      driver: messagingv2
    oslo_messaging_rabbit:
      amqp_durable_queues: false
      rabbit_ha_queues: false
      rabbit_quorum_queue: true
      rabbit_transient_quorum_queue: false
      use_queue_manager: false
      rabbit_interval_max: 10
      # Send more frequent heartbeats and fail unhealthy nodes faster
      # heartbeat_timeout / heartbeat_rate / 2.0 = 30 / 3 / 2.0 = 5
      # https://opendev.org/openstack/oslo.messaging/commit/36fb5bceabe08a982ebd52e4a8f005cd26fdf6b8
      heartbeat_rate: 3
      heartbeat_timeout_threshold: 60
      # Setting lower kombu_reconnect_delay should resolve issue with HA failing when one node is down
      # https://lists.openstack.org/pipermail/openstack-discuss/2023-April/033314.html
      # https://review.opendev.org/c/openstack/oslo.messaging/+/866617
      kombu_reconnect_delay: 0.5

endpoints:
  oslo_db:
    host_fqdn_override:
      default: mariadb-cluster-primary.openstack.svc.cluster.local
    hosts:
      default: mariadb-cluster-primary
  oslo_cache:
    host_fqdn_override:
      default: memcached.openstack.svc.cluster.local
    hosts:
      default: memcached
    statefulset:
      name: memcached-memcached
      replicas: 3
  oslo_messaging:
    host_fqdn_override:
      default: rabbitmq.openstack.svc.cluster.local
    hosts:
      default: rabbitmq-nodes

manifests:
  cron_job_service_cleaner: true
  deployment_api: true
  deployment_central: true
  deployment_worker: true
  deployment_producer: true
  deployment_mdns: true
  deployment_sink: false
  ingress_api: false
  job_rabbit_init: false
  secret_ingress_tls: false
  service_ingress_api: false
