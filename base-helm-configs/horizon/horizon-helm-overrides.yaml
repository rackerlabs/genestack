---
images:
  tags:
    db_init: "ghcr.io/rackerlabs/genestack-images/heat:2026.1-latest"
    db_drop: "ghcr.io/rackerlabs/genestack-images/heat:2026.1-latest"
    horizon_db_sync: "ghcr.io/rackerlabs/genestack-images/horizon:2026.1-latest"
    horizon: "ghcr.io/rackerlabs/genestack-images/horizon:2026.1-latest"
    dep_check: "ghcr.io/rackerlabs/genestack-images/kubernetes-entrypoint:latest"
    image_repo_sync: null

# NOTE: (brew) requests cpu/mem values based on a three node
# hyperconverged lab (/scripts/hyperconverged-lab.sh).
# limit values based on defaults from the openstack-helm charts unless defined
pod:
  resources:
    enabled: true

conf:
  horizon:
    branding:
      logo: >-
        
      logo_splash: >-
        
      favicon: >-
        
    local_settings_d: {}
      ## For example, _50_monasca_ui_settings.py
      # _50_monasca_ui_settings: |
      #   from django.conf import settings
      #   # Grafana button titles/file names (global across all projects):
      #   GRAFANA_LINKS = []
      #   DASHBOARDS = getattr(settings, 'GRAFANA_LINKS', GRAFANA_LINKS)

    local_settings:
      config:
        # Multidomain support with a login dropdown. The dropdown is populated
        # from keystone_domains in map order, so Default is listed first and is
        # the primary (top) entry. keystone_default_domain is the domain used
        # for single-domain operations. Add more domains under keystone_domains
        # as `<domain_name>: "<display label>"` to extend the dropdown.
        #
        # NOTE: Helm deep-merges maps, so the chart's default keystone_domains
        # (which includes example_domain) would otherwise survive. Null out
        # example_domain to drop it from the merged dropdown choices.
        keystone_multidomain_support: "True"
        keystone_multidomain_dropdown: "True"
        keystone_default_domain: "Default"
        keystone_domains:
          Default: "Default"
          example_domain: null
        use_ssl: "True"
        csrf_cookie_httponly: 'True'
        csrf_cookie_secure: 'True'
        disallow_iframe_embed: 'True'
        secure_proxy_ssl_header: true
        session_cookie_httponly: 'True'
        session_cookie_secure: 'True'
    # Each entry must match the installed site-packages dir of the plugin (not
    # its pip egg name), and the plugin must be present in the horizon image or
    # the chart silently skips it. These are the dashboards built into the
    # genestack-images horizon image. Note the names without underscores
    # (cloudkittydashboard, masakaridashboard, designatedashboard) which differ
    # from their pip egg names.
    extra_panels:
      - heat_dashboard
      - octavia_dashboard
      - cloudkittydashboard
      - magnum_ui
      - masakaridashboard
      - designatedashboard
      # - barbican_ui
      # - freezer_ui
      # - trove_dashboard
      # - blazar_dashboard

dependencies:
  static:
    db_sync:
      jobs: []

endpoints:
  dashboard:
    port:
      web:
        default: 80
        internal: 80
        public: 443
        service: 80
  fluentd:
    namespace: fluentbit
  identity:
    port:
      api:
        default: 5000
        internal: 5000
        public: 80
        service: 5000
  oslo_db:
    host_fqdn_override:
      default: mariadb-cluster-primary.openstack.svc.cluster.local
    hosts:
      default: mariadb-cluster-primary
  oslo_cache:
    host_fqdn_override:
      default: memcached.openstack.svc.cluster.local
    statefulset:
      name: memcached-memcached
      replicas: 3
    hosts:
      default: memcached
  oslo_messaging:
    host_fqdn_override:
      default: rabbitmq.openstack.svc.cluster.local
    hosts:
      default: rabbitmq-nodes

manifests:
  configmap_logo: true
  ingress_api: false
  job_db_init: false
  pod_helm_test: false
  secret_ingress_tls: false
  service_ingress: false
