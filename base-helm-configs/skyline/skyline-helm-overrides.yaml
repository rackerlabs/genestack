---
labels:
  skyline:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

images:
  pull_policy: IfNotPresent
  tags:
    skyline_db_sync: ghcr.io/rackerlabs/genestack-images/skyline:2025.1-latest
    skyline: ghcr.io/rackerlabs/genestack-images/skyline:2025.1-latest
    skyline_nginx: ghcr.io/rackerlabs/genestack-images/skyline:2025.1-latest
    db_init: ghcr.io/rackerlabs/genestack-images/openstack-client:2026.1-latest
    dep_check: ghcr.io/rackerlabs/genestack-images/kubernetes-entrypoint:latest
    ks_user: ghcr.io/rackerlabs/genestack-images/openstack-client:2026.1-latest

endpoints:
  fluentd:
    namespace: fluentbit
  identity:
    port:
      api:
        default: 5000
        internal: 5000
        public: 80
        service: 5000
  oslo_db:
    host_fqdn_override:
      default: mariadb-cluster-primary.openstack.svc.cluster.local
    hosts:
      default: mariadb-cluster-primary
    scheme:
      default: mysql
      skyline: mysql
  oslo_cache:
    host_fqdn_override:
      default: memcached.openstack.svc.cluster.local
    hosts:
      default: memcached
    statefulset:
      name: memcached-memcached
      replicas: 3

pod:
  replicas:
    skyline: 1
  resources:
    enabled: false
    skyline:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        memory: "2048Mi"
        cpu: "2000m"
  security_context:
    skyline:
      container:
        skyline:
          runAsUser: 42424
          readOnlyRootFilesystem: true
        nginx:
          runAsUser: 0

dependencies:
  static:
    db_sync:
      jobs: []

conf:
  skyline:
    default:
      debug: true
    openstack:
      interface_type: internal
      default_region: RegionOne
      enforce_new_defaults: true
    features:
      compute: true
      compute_instances: true
      compute_instance_snapshots: true
      compute_flavors: true
      compute_server_groups: true
      compute_images: true
      compute_keypairs: true
      storage: true
      storage_volumes: true
      storage_volume_backup: true
      storage_volume_snapshots: true
      storage_object_storage: false
      storage_container_list: true
      storage_swift_cdn: false
      network: true
      network_networks: true
      network_ports: true
      network_qos_policies: true
      network_routers: true
      network_floating_ips: true
      network_topology: true
      network_load_balancers: false
      network_vpns: false
      network_security_groups: true
      network_firewalls: false
      orchestration: false
      orchestration_stacks: true
      container: false
      container_clusters: true
      container_cluster_templates: true
      key_manager: true
      key_manager_secrets: true
      key_manager_certificates: true
      messaging: false
      messaging_queues: true
      reservation: false
      reservation_leases: true
      scheduled_actions: false
      scheduled_actions_trusts: true
      scheduled_actions_execution_profiles: true
      scheduled_actions_schedules: true
      scheduled_actions_jobs: true
      backup_restore: false
      backup_restore_jobs: true
      backup_restore_actions: true
      backup_restore_clients: true
      backup_restore_backups: true
      database: false
      database_instances: true
      database_backups: true
      database_configurations: true
      shared_file_systems: false
      shared_file_systems_shares: true
      shared_file_systems_networks: true
      shared_file_systems_groups: true
      shared_file_systems_types: true
      shared_file_systems_group_types: true
      shared_file_systems_servers: true
      shared_file_systems_instances: true
      shared_file_systems_backends: true

manifests:
  certificates: false
  configmap_bin: true
  configmap_etc: true
  deployment: true
  job_db_init: true
  job_db_sync: true
  job_db_drop: false
  secret_db: true
  secret_keystone: true
  job_ks_user: true
  service: true
  ingress: false
  service_ingress: false
  secret_registry: true

network:
  skyline:
    ingress:
      public: false
