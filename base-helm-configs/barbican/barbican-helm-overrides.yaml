---
images:
  tags:
    barbican_api: ghcr.io/rackerlabs/genestack-images/barbican:2026.1-latest
    barbican_db_sync: ghcr.io/rackerlabs/genestack-images/barbican:2026.1-latest
    bootstrap: ghcr.io/rackerlabs/genestack-images/openstack-client:latest
    db_drop: ghcr.io/rackerlabs/genestack-images/openstack-client:latest
    db_init: ghcr.io/rackerlabs/genestack-images/openstack-client:latest
    dep_check: ghcr.io/rackerlabs/genestack-images/kubernetes-entrypoint:latest
    image_repo_sync:
    ks_endpoints: ghcr.io/rackerlabs/genestack-images/openstack-client:latest
    ks_service: ghcr.io/rackerlabs/genestack-images/openstack-client:latest
    ks_user: ghcr.io/rackerlabs/genestack-images/openstack-client:latest
    rabbit_init:
    scripted_test: ghcr.io/rackerlabs/genestack-images/openstack-client:latest

# NOTE: (brew) CPU requests values based on a three node
# hyperconverged lab (/scripts/hyperconverged-lab.sh).
# limits based on defaults from the openstack-helm charts unless defined
pod:
  resources:
    enabled: true
    api:
      requests:
        memory: 256Mi
        cpu: 100m
      limits: {}
  # SoftHSM token dir is group-owned; uid 42424 is the barbican user in the image.
  security_context:
    barbican_api:
      pod:
        runAsUser: 42424
        fsGroup: 42424
  mounts:
    barbican_api:
      barbican_api:
        volumeMounts:
          - name: softhsm-tokens
            mountPath: /var/lib/softhsm/tokens
          - name: softhsm-config
            mountPath: /etc/softhsm/softhsm2.conf
            subPath: softhsm2.conf
        volumes:
          - name: softhsm-tokens
            persistentVolumeClaim:
              claimName: barbican-softhsm-tokens
          - name: softhsm-config
            configMap:
              name: barbican-softhsm-config
  lifecycle:
    upgrades:
      deployments:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
        rolling_update:
          max_unavailable: 20%
          max_surge: 3

dependencies:
  static:
    db_sync:
      jobs:
    api:
      jobs:
        - barbican-db-sync
        - barbican-ks-user
        - barbican-ks-endpoints

conf:
  barbican:
    DEFAULT:
      host_href: http://barbican-api.openstack.svc.cluster.local:9311
    database:
      connection_debug: 0
      connection_recycle_time: 600
      connection_trace: true
      mysql_sql_mode: {}
      use_db_reconnect: true
      pool_timeout: 60
      max_retries: -1
    keystone_authtoken:
      service_token_roles: service
      service_token_roles_required: true
      auth_type: password
      auth_version: v3
      memcache_security_strategy: ENCRYPT
      service_type: key-manager
    oslo_concurrency:
      lock_path: /tmp/barbican
    oslo_messaging_notifications:
      driver: messagingv2
    oslo_messaging_rabbit:
      amqp_durable_queues: false
      rabbit_ha_queues: false
      rabbit_quorum_queue: true
      rabbit_transient_quorum_queue: false
      use_queue_manager: false
      rabbit_interval_max: 10
      # Send more frequent heartbeats and fail unhealthy nodes faster
      # heartbeat_timeout / heartbeat_rate / 2.0 = 30 / 3 / 2.0 = 5
      # https://opendev.org/openstack/oslo.messaging/commit/36fb5bceabe08a982ebd52e4a8f005cd26fdf6b8
      heartbeat_rate: 3
      heartbeat_timeout_threshold: 60
      # Setting lower kombu_reconnect_delay should resolve issue with HA failing when one node is down
      # https://lists.openstack.org/pipermail/openstack-discuss/2023-April/033314.html
      # https://review.opendev.org/c/openstack/oslo.messaging/+/866617
      kombu_reconnect_delay: 0.5
    oslo_middleware:
      enable_proxy_headers_parsing: true

    # PKCS#11 Crypto Plugin (SoftHSM2). login (HSM PIN) is injected at
    # deploy time by install-barbican.sh — not stored here.
    # enabled_crypto_plugins is an oslo MultiStrOpt; a YAML list is rendered
    # as one comma-separated name and no plugin loads.
    p11_crypto_plugin:
      library_path: "/usr/lib/softhsm/libsofthsm2.so"
      token_serial_number: ""
      token_labels:
        - "barbican_token"
      login: ""
      mkek_label: "barbican_mkek"
      mkek_length: 32
      hmac_label: "barbican_hmac"
      hmac_mechanism: CKM_SHA256_HMAC
      encryption_mechanism: CKM_AES_CBC
      hmac_key_type: CKK_GENERIC_SECRET
      hmac_keygen_mechanism: CKM_GENERIC_SECRET_KEY_GEN
      key_wrap_mechanism: CKM_AES_KEY_WRAP_PAD
      key_wrap_generate_iv: false
      plugin_name: "PKCS11 HSM"

    crypto:
      # p11_crypto encrypts new secrets. simple_crypto stays loaded so
      # existing SimpleCryptoPlugin blobs keep decrypting until converted.
      enabled_crypto_plugins:
        type: multistring
        values:
          - p11_crypto
          - simple_crypto

  barbican_api_uwsgi:
    uwsgi:
      processes: 2
      threads: 1
  logging:
    logger_root:
      handlers:
        - stdout
      level: INFO

endpoints:
  fluentd:
    namespace: fluentbit
  key_manager:
    hosts:
      public: barbican-api
    port:
      api:
        public: 9311
  oslo_db:
    host_fqdn_override:
      default: mariadb-cluster-primary.openstack.svc.cluster.local
    hosts:
      default: mariadb-cluster-primary
  oslo_cache:
    host_fqdn_override:
      default: memcached.openstack.svc.cluster.local
    hosts:
      default: memcached
    statefulset:
      name: memcached-memcached
      replicas: 3
  oslo_messaging:
    host_fqdn_override:
      default: rabbitmq.openstack.svc.cluster.local
    hosts:
      default: rabbitmq-nodes

manifests:
  ingress_api: false
  job_db_init: false
  job_rabbit_init: false
  secret_ingress_tls: false
  service_ingress_api: false
