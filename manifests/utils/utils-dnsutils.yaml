apiVersion: v1
kind: Pod
metadata:
  name: dnsutils
spec:
  containers:
    - name: dnsutils
      image: registry.k8s.io/e2e-test-images/agnhost:2.40
      command:
        - sleep
        - "infinity"
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: "1"
          memory: "1Gi"
  restartPolicy: Always
