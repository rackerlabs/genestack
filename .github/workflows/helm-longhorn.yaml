---
name: Helm GitHub Actions for longhorn

on:
  pull_request:
    paths:
      - base-kustomize/longhorn/**
      - base-helm-configs/longhorn/**
      - helm-chart-versions.yaml
      - .github/workflows/helm-longhorn.yaml
jobs:
  helm:
    strategy:
      matrix:
        overlays:
          - base
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
        with:
          version: v3.14.3
          token: ${{ secrets.GITHUB_TOKEN }}
        id: helm
      - name: Get chart version
        uses: ./.github/actions/get-chart-version
        id: chart-version
        with:
          chart-name: longhorn
      - name: Add longhorn repo to helm
        run: |
          ${{ steps.helm.outputs.helm-path }} repo add longhorn https://charts.longhorn.io
          ${{ steps.helm.outputs.helm-path }} repo update
      - name: Run Helm Template
        run: |
          ${{ steps.helm.outputs.helm-path }} template longhorn longhorn/longhorn \
            --version ${{ steps.chart-version.outputs.version }} \
            --create-namespace \
            --namespace=longhorn-system \
            --timeout 120m \
            -f ${{ github.workspace }}/base-helm-configs/longhorn/longhorn-helm-overrides.yaml \
            --post-renderer ${{ github.workspace }}/base-kustomize/kustomize.sh \
            --post-renderer-args longhorn/${{ matrix.overlays }} > /tmp/rendered.yaml
      - name: Return helm Build
        uses: actions/upload-artifact@v4
        with:
          name: helm-longhorn-artifact-${{ matrix.overlays }}
          path: /tmp/rendered.yaml
