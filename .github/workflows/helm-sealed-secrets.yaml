---
name: Helm GitHub Actions for sealed-secrets

on:
  pull_request:
    paths:
      - base-kustomize/sealed-secrets/**
      - base-helm-configs/sealed-secrets/**
      - helm-chart-versions.yaml
      - .github/workflows/helm-sealed-secrets.yaml
jobs:
  helm:
    strategy:
      matrix:
        overlays:
          - base
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
        with:
          version: v3.14.3
          token: ${{ secrets.GITHUB_TOKEN }}
        id: helm
      - name: Get chart version
        uses: ./.github/actions/get-chart-version
        id: chart-version
        with:
          chart-name: sealed-secrets
      - name: Add bitnami repo to helm
        run: |
          ${{ steps.helm.outputs.helm-path }} repo add bitnami https://charts.bitnami.com/bitnami
          ${{ steps.helm.outputs.helm-path }} repo update
      - name: Run Helm Template
        run: |
          ${{ steps.helm.outputs.helm-path }} template sealed-secrets bitnami/sealed-secrets \
            --version ${{ steps.chart-version.outputs.version }} \
            --create-namespace \
            --namespace=sealed-secrets \
            --timeout 120m \
            -f ${{ github.workspace }}/base-helm-configs/sealed-secrets/helm-sealed-secrets-overrides.yaml \
            --post-renderer ${{ github.workspace }}/base-kustomize/kustomize.sh \
            --post-renderer-args sealed-secrets/${{ matrix.overlays }} > /tmp/rendered.yaml
      - name: Return helm Build
        uses: actions/upload-artifact@v4
        with:
          name: helm-sealed-secrets-artifact-${{ matrix.overlays }}
          path: /tmp/rendered.yaml
