---
service:
  name: barbican
  version: ~

chart: {}

default_password_warning:
  message: |
    Barbican default simple_crypto KEK material must be rotated carefully; do not delete or randomly replace the KEK on brownfield clusters.
    Stage a new KEK with ${GENESTACK_BASE_DIR}/scripts/rotate-barbican-kek.py --stage, then rerun the Barbican install so db-sync can rewrap existing project KEKs.
    After rollout, validate the deployed KEK with ${GENESTACK_BASE_DIR}/scripts/rotate-barbican-kek.py --validate deployed.

secrets:
  - helm_key: "endpoints.identity.auth.admin.password"
    source_secret: keystone-admin
    source_namespace: openstack
    data_key: password
    helm_flag: --set

  - helm_key: "endpoints.identity.auth.barbican.password"
    source_secret: barbican-admin
    source_namespace: openstack
    data_key: password
    rotate_with_service: true
    helm_flag: --set

  - helm_key: "endpoints.oslo_db.auth.admin.password"
    source_secret: mariadb
    source_namespace: openstack
    data_key: root-password
    helm_flag: --set

  - helm_key: "endpoints.oslo_db.auth.barbican.password"
    source_secret: barbican-db-password
    source_namespace: openstack
    data_key: password
    rotate_with_service: true
    helm_flag: --set

  - helm_key: "conf.barbican.database.connection"
    value: "mysql+pymysql://barbican:${BARBICAN_DB_PASS}@mariadb-cluster-primary:3306/barbican?charset=utf8"
    replace:
      - key: BARBICAN_DB_PASS
        secret: barbican-db-password
        namespace: openstack
        data_key: password

  - helm_key: "endpoints.oslo_messaging.auth.admin.password"
    source_secret: rabbitmq-default-user
    source_namespace: openstack
    data_key: password
    helm_flag: --set

  - helm_key: "endpoints.oslo_messaging.auth.barbican.password"
    source_secret: barbican-rabbitmq-password
    source_namespace: openstack
    data_key: password
    rotate_with_service: true
    helm_flag: --set

  - helm_key: "endpoints.oslo_cache.auth.memcache_secret_key"
    source_secret: os-memcached
    source_namespace: openstack
    data_key: memcache_secret_key
    helm_flag: --set

  - helm_key: "conf.barbican.keystone_authtoken.memcache_secret_key"
    source_secret: os-memcached
    source_namespace: openstack
    data_key: memcache_secret_key
    helm_flag: --set
