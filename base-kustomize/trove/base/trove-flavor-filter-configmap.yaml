---
# Genestack WSGI middleware that filters Trove's /flavors responses so only
# flavors intended for database instances (name prefixed with database_flavor_prefix,
# default "db.") are returned. Delivered as a ConfigMap and mounted onto the
# trove-api PYTHONPATH so no custom image build is required.
#
# NOTE: this is a top-level module (NOT under the trove.* namespace) so it never
# shadows the real trove package on sys.path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trove-flavor-filter
  namespace: openstack
  labels:
    application: trove
    component: api
  annotations:
    helm.sh/resource-policy: keep
data:
  genestack_trove_flavor_filter.py: |
    #    Copyright 2026 Rackspace
