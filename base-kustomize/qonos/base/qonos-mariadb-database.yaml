apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: qonos
  namespace: openstack
  annotations:
    helm.sh/resource-policy: keep
spec:
  mariaDbRef:
    name: mariadb-cluster
    namespace: openstack
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
  retryInterval: 5s
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: qonos
  namespace: openstack
  annotations:
    helm.sh/resource-policy: keep
spec:
  mariaDbRef:
    name: mariadb-cluster
    namespace: openstack
  passwordSecretKeyRef:
    name: qonos-db-password
    key: password
  maxUserConnections: 0
  host: "%"
  retryInterval: 5s
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: qonos-grant
  namespace: openstack
  annotations:
    helm.sh/resource-policy: keep
spec:
  mariaDbRef:
    name: mariadb-cluster
    namespace: openstack
  privileges:
    - "ALL"
  database: "qonos"
  table: "*"
  username: qonos
  grantOption: true
  host: "%"
  retryInterval: 5s
