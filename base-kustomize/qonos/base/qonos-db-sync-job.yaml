apiVersion: batch/v1
kind: Job
metadata:
  name: qonos-db-sync
  namespace: openstack
  labels:
    app.kubernetes.io/component: db-sync
    app.kubernetes.io/instance: qonos
    app.kubernetes.io/name: qonos
    application: qonos
    component: db-sync
    release_group: qonos
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/component: db-sync
        app.kubernetes.io/instance: qonos
        app.kubernetes.io/name: qonos
        application: qonos
        component: db-sync
        release_group: qonos
    spec:
      restartPolicy: OnFailure
      serviceAccountName: qonos
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init
          image: ghcr.io/rackerlabs/genestack-images/kubernetes-entrypoint:1771720239
          imagePullPolicy: IfNotPresent
          command:
            - kubernetes-entrypoint
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INTERFACE_NAME
              value: eth0
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/
            - name: DEPENDENCY_SERVICE
              value: openstack:mariadb-cluster-primary
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
      nodeSelector:
        openstack-control-plane: enabled
      containers:
        - name: qonos-db-sync
          image: ghcr.io/rackerlabs/qonosv2:1788332954
          imagePullPolicy: IfNotPresent
          command:
            - /tmp/qonos-db-sync.sh
          env:
            - name: QONOS_CONFIG_FILE
              value: /etc/qonosv2/qonos.conf
            - name: PYTHONPATH
              value: /app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: qonos-bin
              mountPath: /tmp/qonos-db-sync.sh
              subPath: qonos-db-sync.sh
              readOnly: true
            - name: qonos-etc
              mountPath: /etc/qonosv2/qonos.conf
              subPath: qonos.conf
              readOnly: true
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: qonos-bin
          configMap:
            name: qonos-bin
            defaultMode: 365
        - name: qonos-etc
          secret:
            secretName: qonos-etc
            defaultMode: 292
