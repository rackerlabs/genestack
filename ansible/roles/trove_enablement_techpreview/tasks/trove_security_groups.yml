---
# Trove pre-configuration (pre-deploy): security group creation.
# Must run AFTER Keystone and Neutron are deployed.

- name: Check if clouds.yaml already exists
  ansible.builtin.stat:
    path: "{{ ubuntu_home }}/.config/openstack/clouds.yaml"
  register: _trove_clouds_yaml_stat

- name: Generate clouds.yaml via setup-openstack-rc.sh (safety net)
  ansible.builtin.shell:
    cmd: |
      source {{ genestack_venv }}/bin/activate
      set -a
      source {{ genestack_rc }}
      set +a
      bash /opt/genestack/bin/setup-openstack-rc.sh
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: not _trove_clouds_yaml_stat.stat.exists

- name: Derive effective security groups recreation flag
  ansible.builtin.set_fact:
    _recreate_security_groups: "{{ (trove_force_recreate_security_groups | default(false) | bool) or (force_full_recreation | default(false) | bool) }}"

- name: Delete existing Trove security groups
  ansible.builtin.shell: |
    source {{ genestack_venv }}/bin/activate
    set -a
    source {{ genestack_rc }}
    set +a
    openstack security group delete {{ trove_secgroup_name }} 2>/dev/null || true
    openstack security group delete {{ trove_services_secgroup_name }} 2>/dev/null || true
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _recreate_security_groups | bool

- name: Check if trove security group exists
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} security group show {{ trove_secgroup_name }} -f json
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  register: _trove_secgroup_check
  changed_when: false
  failed_when: false

- name: Determine if security groups need to be created
  ansible.builtin.set_fact:
    _do_create_security_groups: "{{ (_trove_secgroup_check.rc != 0) or (_recreate_security_groups | bool) }}"

- name: Create trove access security group
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} security group create
      --description "Security group for Trove instances" {{ trove_secgroup_name }}
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _do_create_security_groups | bool

- name: Create ICMP rule for trove security group
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} security group rule create
      --protocol icmp --remote-ip {{ trove_secgroup_remote_ip }} {{ trove_secgroup_name }}
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _do_create_security_groups | bool

- name: Create SSH rule for trove security group
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} security group rule create
      --protocol tcp --dst-port 22 --remote-ip {{ trove_secgroup_remote_ip }} {{ trove_secgroup_name }}
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _do_create_security_groups | bool

- name: Create 3306 rule for trove security group
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} security group rule create
      --protocol tcp --dst-port 3306 --remote-ip {{ trove_mgmt_subnet_cidr }} {{ trove_secgroup_name }}
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _do_create_security_groups | bool

- name: Create trove services security group
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} security group create
      --description "Security group for Trove services VIP (RabbitMQ, Keystone)" {{ trove_services_secgroup_name }}
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _do_create_security_groups | bool

- name: Create RabbitMQ rule for trove services security group
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} security group rule create
      --protocol tcp --dst-port 5672 --remote-ip {{ trove_mgmt_subnet_cidr }} {{ trove_services_secgroup_name }}
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _do_create_security_groups | bool

- name: Create Keystone rule for trove services security group
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} security group rule create
      --protocol tcp --dst-port 5000 --remote-ip {{ trove_mgmt_subnet_cidr }} {{ trove_services_secgroup_name }}
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _do_create_security_groups | bool

- name: Create Swift rule for trove services security group
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} security group rule create
      --protocol tcp --dst-port 8080 --remote-ip {{ trove_mgmt_subnet_cidr }} {{ trove_services_secgroup_name }}
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _do_create_security_groups | bool
