---
# Ensure Trove K8s secrets exist before the Helm install.
#
# Chart-derived Trove passwords are managed by /opt/genestack/bin/services/trove.yaml
# and the shared install-script helpers. This role owns only the techpreview
# trove-ssh keypair secret used by the post-install access workflow.

- name: Derive effective Trove SSH keypair recreation flag
  ansible.builtin.set_fact:
    _recreate_trove_ssh_secret: "{{ (trove_force_recreate_secrets | default(false) | bool) or (force_full_recreation | default(false) | bool) }}"

- name: Ensure Trove service secrets from install-script schema
  ansible.builtin.shell: |
    source {{ genestack_venv }}/bin/activate
    set -a
    source {{ genestack_rc }}
    set +a
    export GENESTACK_BASE_DIR=/opt/genestack
    source /opt/genestack/bin/helpers.sh
    secret_ensure_service "$(cat /opt/genestack/bin/services/trove.yaml)" trove
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"

- name: Delete existing Trove SSH keypair secret
  ansible.builtin.shell: |
    source {{ genestack_venv }}/bin/activate
    set -a
    source {{ genestack_rc }}
    set +a
    kubectl -n openstack delete secret trove-ssh --ignore-not-found=true
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _recreate_trove_ssh_secret | bool

- name: Check if Trove SSH keypair secret exists
  ansible.builtin.shell: |
    source {{ genestack_venv }}/bin/activate
    set -a
    source {{ genestack_rc }}
    set +a
    kubectl -n openstack get secret trove-ssh -o name 2>/dev/null
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  register: _trove_ssh_secret_check
  changed_when: false
  failed_when: false

- name: Create Trove SSH keypair secret
  ansible.builtin.shell: |
    set -euo pipefail
    source {{ genestack_venv }}/bin/activate
    set -a
    source {{ genestack_rc }}
    set +a

    tmp_dir="$(mktemp -d)"
    cleanup() {
      rm -rf "${tmp_dir}"
    }
    trap cleanup EXIT

    ssh-keygen -qt ed25519 -N '' -C "trove_ssh" -f "${tmp_dir}/trove_ssh_key"

    kubectl -n openstack create secret generic trove-ssh \
      --from-file=public-key="${tmp_dir}/trove_ssh_key.pub" \
      --from-file=private-key="${tmp_dir}/trove_ssh_key" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: (_trove_ssh_secret_check.rc != 0) or (_recreate_trove_ssh_secret | bool)

- name: Set flag indicating Trove SSH keypair secret was recreated
  ansible.builtin.set_fact:
    trove_secrets_recreated: "{{ (_trove_ssh_secret_check.rc != 0) or (_recreate_trove_ssh_secret | bool) }}"
