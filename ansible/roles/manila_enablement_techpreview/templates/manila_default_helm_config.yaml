---
images:
  pull_policy: "Always"

# NOTE: (brew) requests cpu/mem values based on a three node
# hyperconverged lab (/scripts/hyperconverged-lab.sh).
# limit values based on defaults from the openstack-helm charts unless defined
pod:
  # hostNetwork 'hostname --fqdn' lookup fails in the share pod and injects an
  # empty [generic] service_network_host, which manila >= 22.x rejects at
  # startup; unused with connect_share_server_to_tenant_network enabled.
  use_fqdn:
    share: false
  replicas:
    api: 2
    data: 2
    scheduler: 2
    share: 3
  lifecycle:
    upgrades:
      deployments:
        rolling_update:
          max_unavailable: 20%

  resources:
    enabled: true
    api:
      requests:
        memory: "256Mi"
        cpu: "500m"
      limits:
        memory: "2048Mi"
        cpu: "2000m"
    data:
      requests:
        memory: "256Mi"
        cpu: "500m"
      limits:
        memory: "2048Mi"
        cpu: "2000m"
    scheduler:
      requests:
        memory: "256Mi"
        cpu: "500m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    share:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "2048Mi"
        cpu: "2000m"

bootstrap:
  enabled: false

conf:
  manila:
    DEFAULT:
      default_availability_zone: az1
      default_share_type: generic
      default_share_group_type: generic
      data_node_access_ips: "10.254.0.0/16"
      enabled_share_backends: generic
      enabled_share_protocols: NFS,CIFS
      storage_availability_zone: az1
      share_name_template: "share-%s"
      rootwrap_config: /etc/manila/rootwrap.conf
      api_paste_config: /etc/manila/api-paste.ini
      enable_new_services: true
      debug: true
    generic:
      share_backend_name: GENERIC
      share_driver: manila.share.drivers.generic.GenericShareDriver
      enabled_share_protocols: NFS,CIFS
      driver_handles_share_servers: true
      connect_share_server_to_tenant_network: True
      service_network_name: manila-service-network
      manila_service_keypair_name: manila-service-keypair
      path_to_private_key: /var/lib/openstack/.ssh/manila-service-keypair.pem
      path_to_public_key: /var/lib/openstack/.ssh/manila-service-keypair.pub
      network_config_group: generic_network
      volume_api_class: manila.volume.cinder.API
      max_time_to_create_volume: 180
      max_time_to_extend_volume: 180
      max_time_to_attach: 120
      volume_name_template: "manila-share-%s"
      volume_snapshot_name_template: "manila-snapshot-%s"
      service_image_id: {{manila_service_image_id}}
      service_image_name: manila-service-image
      service_instance_availability_zone: az1
      service_instance_user: manila
      service_instance_flavor_id: {{manila_service_instance_flavor_id}}
      service_instance_name_template: "%s"
      service_instance_security_group: manila-service-sg
      service_network_cidr: "10.254.0.0/16"
      service_network_division_mask: 24
      backend_availability_zone: az1
      lvm_share_volume_group: cinder-volumes-1
      cinder_volume_type: Standard
    generic_network:
      interface_driver: manila.network.linux.interface.OVSInterfaceDriver
    cinder:
      cross_az_attach: true
    barbican:
      barbican_endpoint_type: internal
    key_manager:
      backend: barbican
    database:
      max_retries: -1
    oslo_messaging_notifications:
      driver: noop
  manila_api_uwsgi:
    uwsgi:
      add-header: "Connection: close"
      buffer-size: 65535
      die-on-term: true
      enable-threads: true
      exit-on-reload: false
      hook-master-start: unix_signal:15 gracefully_kill_them_all
      lazy-apps: true
      log-x-forwarded-for: true
      master: true
      procname-prefix-spaced: "manila-api:"
      route-user-agent: '^kube-probe.* donotlog:'
      thunder-lock: true
      worker-reload-mercy: 80
      wsgi-file: /var/lib/openstack/bin/manila-wsgi
      processes: 1
  logging:
    logger_root:
      level: DEBUG
      handlers: stdout
    logger_manila:
      level: DEBUG
      handlers: stdout

manifests:
  deployment_share: true
