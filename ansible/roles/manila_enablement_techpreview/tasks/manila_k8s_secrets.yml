---
# Ensure Manila K8s secret prerequisites exist before the service image build.
#
# Chart-derived Manila passwords are managed by /opt/genestack/bin/services/manila.yaml
# and the shared install-script helpers. This role may force recreation only for
# the Manila service SSH keypair used by the service image workflow.

- name: Derive effective Manila keypair recreation flag
  ansible.builtin.set_fact:
    _recreate_manila_keypair_secret: >-
      {{ (manila_force_recreate_secrets | bool)
         or (force_recreate_keypair | bool)
         or (force_full_recreation | bool) }}

- name: Delete existing Manila service keypair secret
  ansible.builtin.shell: |
    source {{ genestack_venv }}/bin/activate
    set -a
    source {{ genestack_rc }}
    set +a
    kubectl -n openstack delete secret manila-service-keypair --ignore-not-found=true
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _recreate_manila_keypair_secret | bool

- name: Check if Manila service keypair secret exists
  ansible.builtin.shell: |
    source {{ genestack_venv }}/bin/activate
    set -a
    source {{ genestack_rc }}
    set +a
    kubectl -n openstack get secret manila-service-keypair -o name 2>/dev/null
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  register: _manila_keypair_secret_check
  changed_when: false
  failed_when: false

- name: Determine if Manila service keypair secret changed
  ansible.builtin.set_fact:
    _manila_keypair_secret_changed: >-
      {{ (_manila_keypair_secret_check.rc != 0)
         or (_recreate_manila_keypair_secret | bool) }}

- name: Ensure Manila service secrets from install-script schema
  ansible.builtin.shell: |
    source {{ genestack_venv }}/bin/activate
    set -a
    source {{ genestack_rc }}
    set +a
    export GENESTACK_BASE_DIR=/opt/genestack
    source /opt/genestack/bin/helpers.sh
    trap cleanup_tmp EXIT
    secret_ensure_service "$(cat /opt/genestack/bin/services/manila.yaml)" manila
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"

- name: Set flag indicating Manila keypair secret was recreated
  ansible.builtin.set_fact:
    manila_secrets_recreated: "{{ _manila_keypair_secret_changed | bool }}"
