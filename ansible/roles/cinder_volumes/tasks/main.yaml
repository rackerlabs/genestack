---

- name: Gather variables for each operating system
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_version'] | lower }}.yaml"
        - "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_major_version'] | lower }}.yaml"
        - "{{ ansible_facts['os_family'] | lower }}-{{ ansible_facts['distribution_major_version'] | lower }}.yaml"
        - "{{ ansible_facts['distribution'] | lower }}.yaml"
        - "{{ ansible_facts['os_family'] | lower }}.yaml"
      paths:
        - "{{ role_path }}/vars"
  tags:
    - always

- ansible.builtin.debug:
    msg:
      - "Configuring backend: {{ cinder_backend_name }}"
      - "Configuring worker: {{ cinder_worker_name }}"

- ansible.builtin.debug:
    msg:
      - "Multipath: {{ storage_network_multipath }}"
  when:
    - cinder_worker_name | lower == "lvm"

- ansible.builtin.debug:
    msg:
      - "Client SSL Cert: {{ cinder_enable_storage_ssl }}"
      - "Client SSL Dir: {{ cinder_storage_cert_src_dir }}"
      - "Client SSL Certs: {{ cinder_storage_cert_filenames }}"
  when:
    - cinder_worker_name | lower != "lvm"

- name: Wait for apt/dpkg locks to be released
  ansible.builtin.shell: |
    while fuser /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
      echo "apt/dpkg lock held, waiting..."
      sleep 5
    done
  changed_when: false
  when:
    - ansible_facts['os_family'] | lower == 'debian'

# run_once: every host in the play delegates this block to the first
# control-plane node; without it, N parallel apt-get invocations race each
# other for the dpkg lock on that one node (only one wins). The registered
# secret result is propagated to all play hosts by run_once.
- name: K8S Facts block
  delegate_to: "{{ groups['kube_control_plane'][0] }}"
  run_once: true
  block:
    - name: Ensure python3-kubernetes is available
      ansible.builtin.package:
        name: python3-kubernetes
        state: present
        update_cache: true
      register: _py3_kubernetes_install
      until: _py3_kubernetes_install is success
      retries: 20
      delay: 5

    - name: Read cinder-etc secrets
      kubernetes.core.k8s_info:
        kind: Secret
        name: cinder-etc
        namespace: openstack
      register: _kubernetes_cinder_etc_secret

    - name: Read cinder-ks-etc secrets
      kubernetes.core.k8s_info:
        kind: Secret
        name: cinder-ks-etc
        namespace: openstack
      register: _kubernetes_cinder_ks_etc_secret

- name: OpenStack Internal Tenant Lookup block
  delegate_to: "{{ cinder_openstack_delegate_host | default('localhost') }}"
  become: false
  run_once: true
  when:
    - cinder_enable_internal_tenant | bool
    - (cinder_internal_tenant_project_id | default('') | length == 0) or (cinder_internal_tenant_user_id | default('') | length == 0)
  block:
    - name: Resolve internal tenant project info from Keystone
      openstack.cloud.project_info:
        cloud: "{{ cinder_openstack_cloud | default('default') }}"
        name: "{{ cinder_internal_project_name }}"
      register: _internal_project_info
      failed_when: false

    - name: Resolve internal tenant user info from Keystone
      openstack.cloud.identity_user_info:
        cloud: "{{ cinder_openstack_cloud | default('default') }}"
        name: "{{ cinder_internal_user_name }}"
      register: _internal_user_info
      failed_when: false

- name: Install cinder distro packages
  ansible.builtin.package:
    name: "{{ cinder_volume_package_list }}"
    state: "{{ cinder_volume_package_state }}"
    update_cache: true
  when:
    - cinder_volume_package_list | length > 0
  register: install_packages
  until: install_packages is success
  retries: 20
  delay: 5

- name: Install cinder-backend distro packages
  ansible.builtin.package:
    name: "{{ cinder_backend_packages[ cinder_worker_name ] }}"
    state: "{{ cinder_volume_package_state }}"
    update_cache: true
  when:
    - cinder_volume_package_list | length > 0
  register: install_backend_packages
  until: install_backend_packages is success
  retries: 20
  delay: 5

- name: Determine iscsi initiator name
  set_fact:
    initiator_name: >
      {% set _iqn = "iqn.2004-10.com." + ansible_distribution |lower() + ":" + ansible_hostname -%}
      {% if ansible_iscsi_iqn is defined -%}
      {% if (ansible_iscsi_iqn |length >= 15) -%}
      {% set _iqn = ansible_iscsi_iqn  -%}
      {% endif -%}
      {% endif -%}
      {{ _iqn }}

- name: Set iscsi initiator name if not set
  ansible.builtin.lineinfile:
    path: /etc/iscsi/initiatorname.iscsi
    regexp: '^InitiatorName=.*|^GenerateName=.*'
    line: "InitiatorName={{ initiator_name }}"

- name: Configure SSL certificate for storage API access
  ansible.builtin.include_tasks: configure_storage_certificate.yaml
  when:
    - cinder_worker_name | lower != "lvm"

- name: Upgrade pip and install required packages
  ansible.builtin.pip:
    name:
      - pip
      - pymysql
      - "git+https://github.com/openstack/cinder@{{ cinder_release_branch }}"
      - "git+{{ cinder_rxt_git_repo }}@{{ cinder_rxt_release_branch }}"
    state: present
    virtualenv: "{{ cinder_virtualenv_path }}"
    virtualenv_command: python3 -m venv
    extra_args: "-c https://releases.openstack.org/constraints/upper/{{ cinder_release_branch | regex_replace('^(stable|unmaintained)/', '') }}"


- name: "Get Python site-packages path from virtualenv"
  command: "{{ cinder_virtualenv_path }}/bin/python -c 'import site; print(site.getsitepackages()[0])'"
  register: venv_site
  changed_when: false

- name: "Normalize site-packages path"
  set_fact:
    venv_site_packages: "{{ venv_site.stdout | trim }}"

- name: "Ensure site-packages exists"
  file:
    path: "{{ venv_site_packages }}"
    state: directory
  when: venv_site_packages != ""

- name: Install eventlet SSL patch
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - src: "../templates/zzz_eventlet_ssl_patch.pth"
      dest: "{{ venv_site_packages }}/zzz_eventlet_ssl_patch.pth"
      mode: "0644"
    - src: "../templates/eventlet_ssl_patch.py"
      dest: "{{ venv_site_packages }}/eventlet_ssl_patch.py"
      mode: "0644"
  when:
    - cinder_worker_name | lower != "lvm"

- name: Create the cinder system user
  ansible.builtin.user:
    name: cinder
    comment: Cinder system user
    shell: /bin/false
    system: true
    createhome: true
    home: /var/lib/cinder
    groups: disk
    append: true

- name: Create the cinder system group
  ansible.builtin.group:
    name: cinder
    system: true

- name: Create the cinder service directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: cinder
    group: cinder
    mode: "0755"
  loop:
    - /var/lib/cinder/backup
    - /var/lib/cinder/tmp
    - /var/lib/cinder/volumes
    - /var/lib/cinder/conversion
    - /var/lock/cinder

- name: Create systemd-tmpfiles configuration for cinder lock_path
  ansible.builtin.copy:
    content: |
      d /run/lock/cinder 0755 cinder cinder -
    dest: /etc/tmpfiles.d/cinder.conf
    owner: root
    group: root
    mode: "0644"

- name: Create the cinder configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('cinder') }}"
    group: "{{ item.group | default('cinder') }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    - { path: "/opt/cinder/etc/cinder", mode: "0750" }
    - { path: "/opt/cinder/etc/cinder/cinder.conf.d", mode: "0750" }
    - { path: "/opt/cinder/etc/cinder/rootwrap.d", mode: "0755", owner: "root", group: "root" }

- name: Create symlink for the etc directory
  ansible.builtin.file:
    src: /opt/cinder/etc/cinder
    dest: /etc/cinder
    state: link
    owner: cinder
    group: cinder

- name: Create the base cinder-volume configuration
  ansible.builtin.copy:
    content: "{{ _kubernetes_cinder_etc_secret.resources[0].data['cinder.conf'] | b64decode }}"
    dest: /etc/cinder/cinder.conf
    owner: root
    group: cinder
    mode: "0640"
  notify:
    - "restart cinder services"

- name: Deploy modular snippets from cinder-ks-etc into cinder.conf.d
  ansible.builtin.copy:
    content: "{{ item.value | b64decode }}"
    dest: "/etc/cinder/cinder.conf.d/{{ item.key }}"
    owner: root
    group: cinder
    mode: "0640"
  loop: "{{ (_kubernetes_cinder_ks_etc_secret.resources[0].data | default({})) | dict2items }}"
  when:
    - _kubernetes_cinder_ks_etc_secret.resources | default([]) | length > 0
  notify:
    - "restart cinder services"

- name: Configure cinder lock_path
  ansible.builtin.copy:
    content: |
      [oslo_concurrency]
      lock_path = /var/lock/cinder

      [os_brick]
      lock_path = /var/lock/cinder
    dest: /etc/cinder/cinder.conf.d/lock_path.conf
    owner: root
    group: cinder
    mode: "0640"
  notify:
    - "restart cinder services"

- name: Set internal tenant facts
  ansible.builtin.set_fact:
    cinder_internal_tenant_project_id: >-
      {{
        cinder_internal_tenant_project_id
        if (cinder_internal_tenant_project_id | default('') | length > 0)
        else (((_internal_project_info | default({})).openstack_projects | default((_internal_project_info | default({})).projects | default([])))[0].id | default(''))
      }}
    cinder_internal_tenant_user_id: >-
      {{
        cinder_internal_tenant_user_id
        if (cinder_internal_tenant_user_id | default('') | length > 0)
        else (((_internal_user_info | default({})).openstack_users | default((_internal_user_info | default({})).users | default([])))[0].id | default(''))
      }}
  when:
    - cinder_enable_internal_tenant | bool


- name: Configure cinder internal tenant and image-volume cache
  ansible.builtin.copy:
    content: |
      [DEFAULT]
      cinder_internal_tenant_project_id = {{ cinder_internal_tenant_project_id }}
      cinder_internal_tenant_user_id = {{ cinder_internal_tenant_user_id }}
      image_volume_cache_enabled = {{ cinder_image_volume_cache_enabled | bool }}
      image_volume_cache_max_size_gb = {{ cinder_image_volume_cache_max_size_gb }}
      image_volume_cache_max_count = {{ cinder_image_volume_cache_max_count }}
    dest: /etc/cinder/cinder.conf.d/internal_tenant.conf
    owner: root
    group: cinder
    mode: "0640"
  when:
    - cinder_enable_internal_tenant | bool
    - cinder_internal_tenant_project_id | default('') | length > 0
    - cinder_internal_tenant_user_id | default('') | length > 0
  notify:
    - "restart cinder services"

- name: Create the cinder-volume filters and logging configuration
  ansible.builtin.copy:
    content: "{{ _kubernetes_cinder_etc_secret.resources[0].data[item.src] | b64decode }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: "logging.conf"
      dest: /etc/cinder/logging.conf
    - src: "volume.filters"
      dest: /etc/cinder/rootwrap.d/volume.filters
    - src: "rootwrap.conf"
      dest: /etc/cinder/rootwrap.conf

- name: Replace exec path in rootwrap
  community.general.ini_file:
    path: /etc/cinder/rootwrap.conf
    section: DEFAULT
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    create: true
  loop:
    - key: "exec_dirs"
      value: "{{ cinder_virtualenv_path }}/bin,/sbin,/usr/sbin,/bin,/usr/bin,/usr/local/bin,/usr/local/sbin,/usr/lpp/mmfs/bin"
    - key: "filters_path"
      value: "/etc/cinder/rootwrap.d"

- name: Configure storage backend
  ansible.builtin.include_tasks: configure_backend.yaml
  when:
    - cinder_worker_name | lower != "lvm"

- name: Configure lvm backend
  ansible.builtin.include_tasks: configure_backend_lvm.yaml
  when:
    - cinder_worker_name | lower == "lvm"

- name: Cleanup
  ansible.builtin.include_tasks: cleanup.yaml
