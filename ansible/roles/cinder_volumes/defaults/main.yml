---

cinder_release_branch: "stable/2026.1"
storage_network_interface: ansible_br_storage
storage_network_interface_secondary:
cinder_backend_name: ""
cinder_worker_name: "netapp" # Other possibilities: lvm, storage (non NetApp)

cinder_virtualenv_path: "/opt/cinder"
storage_network_multipath: false
cinder_enable_storage_ssl: false
cinder_storage_cert_src_dir: "/opt/genestack/ansible/playbooks/templates/"
cinder_storage_cert_filenames:
  - "ontap-cluster-host.crt"
  - "ontap-vserver-host.crt"

cinder_volume_package_state: latest

# cinder-rxt repository and release branch configuration
cinder_rxt_git_repo: "https://github.com/rackerlabs/cinder-rxt.git"
cinder_rxt_release_branch: "release-2026.3"

# Cinder Internal Tenant & Image-Volume Cache
cinder_enable_internal_tenant: true
cinder_openstack_cloud: "{{ openstack_cloud | default('default') }}"
cinder_openstack_delegate_host: "localhost"
cinder_internal_project_name: "internal_cinder"
cinder_internal_user_name: "internal_cinder"

cinder_internal_tenant_project_id: ""
cinder_internal_tenant_user_id: ""
cinder_image_volume_cache_enabled: true
cinder_image_volume_cache_max_size_gb: 400
cinder_image_volume_cache_max_count: 10
